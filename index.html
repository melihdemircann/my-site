<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Melih Demircan — Developer & Designer</title>
  <meta name="description"
    content="Melih Demircan — Bilgisayar Mühendisi, AI geliştirici ve girişimci. 3D CV portfolyosu." />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;700;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- INTRO SCREEN -->
  <div id="intro">
    <div class="intro-bg"></div>
    <div class="intro-content">
      <div class="intro-name">
        <span class="intro-first">Melih</span>
        <span class="intro-last">Demircan</span>
      </div>
      <div class="intro-title">Bilgisayar Mühendisi</div>
      <button id="play-btn" aria-label="Sanal turu başlat">
        <span class="play-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5,3 19,12 5,21" />
          </svg>
        </span>
        <span class="play-label">Sanal Yürüyüşü Başlat</span>
      </button>
      <div class="intro-hint">Eğitim · Deneyim · Projeler · Sertifikalar · Yetenekler</div>
      <div class="scroll-hint">
        <div class="device-icon">
          <div class="mouse-icon">
            <div class="wheel"></div>
          </div>
          <div class="touch-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2v8m-4-4l4-4 4 4" />
              <path d="M7 14c-1.1 0-2 .9-2 2v3c0 1.7 1.3 3 3 3h8c1.7 0 3-1.3 3-3v-6c0-1.1-.9-2-2-2s-2 .9-2 2v1" />
            </svg>
          </div>
        </div>
        <span class="scroll-text">Kaydırarak (scroll) veya dokunarak ileri-geri gezinebilirsiniz</span>
      </div>
    </div>
    <div class="intro-scanlines"></div>
  </div>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <span id="hud-section">—</span>
    </div>
    <div class="hud-progress">
      <div id="hud-bar"></div>
    </div>
  </div>

  <!-- Nav dots -->
  <div id="nav-dots" class="hidden"></div>

  <!-- Pause/Play control -->
  <button id="walk-toggle" class="hidden" aria-label="Pause">
    <span class="toggle-icon">
      <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="width:14px;height:14px;">
        <rect x="6" y="4" width="4" height="16" />
        <rect x="14" y="4" width="4" height="16" />
      </svg>
      <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor" style="display:none;width:14px;height:14px;">
        <polygon points="5,3 19,12 5,21" />
      </svg>
    </span>
    <span id="toggle-label">Durdur</span>
  </button>



  <!-- Mobile Guide Tooltip -->
  <div id="mobile-guide" class="mobile-guide hidden">
    <span>👆 Sağa/sola bakmak için kaydırın</span>
  </div>

  <!-- Mobile Quick Look Buttons (Visible on mobile screens) -->
  <div id="mobile-look-controls" class="hidden">
    <button id="look-left-btn" aria-label="Sola bak">◂ SOLA BAK</button>
    <button id="look-front-btn" aria-label="Öne bak">ÖN</button>
    <button id="look-right-btn" aria-label="Sağa bak">SAĞA BAK ▸</button>
  </div>

  <!-- Canvas -->
  <canvas id="c"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
